{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Demotape{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
</head>
<body>
    <header class="site-header">
        <div class="container">
            <h1 class="site-title"><a href="{% url 'pages:home' %}">DEMOTAPE</a></h1>
            <nav class="main-nav">
                <a href="{% url 'pages:home' %}">Home</a>
                <a href="{% url 'music:band_list' %}">Bands</a>
                <a href="{% url 'pages:about' %}">About</a>
                {% if user.is_authenticated %}
                    <span class="user-greeting">Hello, {{ user.username }}</span>
                    <a href="{% url 'account_logout' %}">Logout</a>
                {% else %}
                    <a href="{% url 'account_login' %}">Login</a>
                    <a href="{% url 'account_signup' %}">Register</a>
                {% endif %}
            </nav>
        </div>
    </header>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>&copy; 2026 Demotape — Underground Music Archive</p>
        </div>
    </footer>

    <script src="{% static 'js/main.js' %}"></script>
</body>
</html>
